services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce -d ecommerce']
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      args:
        APP: auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
      JWT_SECRET: ${JWT_SECRET:-secret}
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: .
      args:
        APP: product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        APP: order-service
    container_name: order-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
      PRODUCT_SERVICE_URL: product-service:5001
      ORDER_EXPIRE_MINUTES: ${ORDER_EXPIRE_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started

  payment-service:
    build:
      context: .
      args:
        APP: payment-service
    container_name: payment-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ecommerce:ecommerce@postgres:5432/ecommerce
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      args:
        APP: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-secret}
      AUTH_SERVICE_URL: auth-service:5000
      PRODUCT_SERVICE_URL: product-service:5001
      ORDER_SERVICE_URL: order-service:5002
      PAYMENT_SERVICE_URL: payment-service:5003
    depends_on:
      - auth-service
      - product-service
      - order-service
      - payment-service

volumes:
  postgres_data:
